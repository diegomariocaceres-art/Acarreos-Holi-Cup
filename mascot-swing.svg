<linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#0c4146"/><stop offset=".48" stop-color="#267c75"/><stop offset="1" stop-color="#e9c879"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#f2d274" stop-opacity=".45"/><stop offset="1" stop-color="#edcf83" stop-opacity="0"/></radialGradient>
