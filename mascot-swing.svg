<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 550" role="img" aria-labelledby="title desc">
<title id="title">Mascota golfista Holi Cup haciendo swing</title><desc id="desc">Un simpático champiñón golfista con gorra roja y manchas blancas completa un golpe de golf entre destellos dorados</desc>
