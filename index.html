const { useState, useEffect } = React;

const SUPABASE_URL = "https://xxbrrtxuqrbypaqioqfq.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4YnJydHh1cXJieXBhcWlvcWZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2OTY1MzMsImV4cCI6MjA5NTI3MjUzM30.dfVWR8PW52_CyqJUd1bnZCoWhefZNgSOlWo5783akHE";

const headers = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json",
  "Prefer": "return=representation"
};

async function dbSelect() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/fechas?select=*&order=id`, { headers });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function dbInsert(row) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/fechas`, {
    method: "POST", headers,
    body: JSON.stringify(row)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

const FINAL_HANDICAP = {1:6,2:5,3:4,4:3,5:2,6:1};
const PRIZE_SPLIT = {1:0.60,2:0.30,3:0.10};
const ALL_PLAYERS = ["El Doctor","Felipao","Gio","Diegolfa","Felipe R","Ñaño","Daniel B","Garbimba Asesina","Pistolas","Juanca","Paisa","Nayibe","Fercho","El Nene","Yerri","Juan Rory","Chapo","Dani B"];
const trophyColors = ["#FFD700","#C0C0C0","#CD7F32"];
const trophyEmoji  = ["🥇","🥈","🥉"];

function calcTotalPoints(scores) {
  return [...scores].sort((a,b)=>b-a).slice(0,8).reduce((a,b)=>a+b,0);
}

function buildPlayers(fechas) {
  return ALL_PLAYERS.map(name => {
    const scores = fechas.map(f => {
      const pts = f.resultados[name] ?? 0;
      return f.es_playoff ? pts * 2 : pts;
    });
    const paid = fechas.map(f => f.pagos[name] ?? 0);
    const wins = fechas.map(f => f.daily_wins[name] ?? 0);
    const datesPlayed = fechas.filter(f => (f.resultados[name] ?? 0) > 0).length;
    const total = calcTotalPoints(scores);
    return { name, scores, paid, wins, datesPlayed, total };
  });
}

function App() {
  const [fechas, setFechas] = useState([]);
  const [activeTab, setActiveTab] = useState("ranking");
  const [showAddDate, setShowAddDate] = useState(false);
  const [newResults, setNewResults] = useState({});
  const [newPaid, setNewPaid] = useState({});
  const [newWinner, setNewWinner] = useState(null);
  const [newIsPlayoff, setNewIsPlayoff] = useState(false);
  const [expandedPlayer, setExpandedPlayer] = useState(null);
  const [finalScores, setFinalScores] = useState({});
  const [finalClosed, setFinalClosed] = useState(false);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => { loadFechas(); }, []);

  async function loadFechas() {
    try {
      const data = await dbSelect();
      setFechas(data || []);
      setLoading(false);
    } catch(e) { setError(e.message); setLoading(false); }
  }

  async function handleAddDate() {
    const resultados = {}, pagos = {}, daily_wins = {};
    ALL_PLAYERS.forEach(p => {
      const pts = parseInt(newResults[p] ?? '0') || 0;
      if (pts > 0) resultados[p] = pts;
      if (newPaid[p]) pagos[p] = 10;
      if (newWinner === p) daily_wins[p] = 10;
    });
    try {
      await dbInsert({ nombre: `Fecha ${fechas.length + 1}`, es_playoff: newIsPlayoff, resultados, pagos, daily_wins });
      setNewResults({}); setNewPaid({}); setNewWinner(null); setNewIsPlayoff(false); setShowAddDate(false);
      loadFechas();
    } catch(e) { alert("Error guardando: " + e.message); }
  }

  const players = buildPlayers(fechas);
  const ranked = [...players].sort((a,b) => b.total - a.total);
  let pos = 1;
  const withPos = ranked.map((p,i) => {
    if (i > 0 && ranked[i-1].total !== p.total) pos = i + 1;
    return { ...p, pos };
  });
  const pot = players.reduce((s,p) => s + p.paid.reduce((a,b)=>a+b,0), 0);
  const qualified = withPos.filter(p => p.datesPlayed >= 6);
  const finalResults = qualified
    .filter(p => finalScores[p.name] != null && finalScores[p.name] !== "")
    .map((p,i) => { const gross = Number(finalScores[p.name]); const hcp = FINAL_HANDICAP[i+1] ?? 0; return { ...p, gross, hcp, net: gross - hcp }; })
    .sort((a,b) => a.net - b.net);
  const prizes = finalClosed ? finalResults.slice(0,3).map((p,i) => ({ ...p, prize: Math.round(pot * PRIZE_SPLIT[i+1]) })) : [];

  if (loading) return React.createElement('div', {style:{minHeight:"100vh",background:"#0a0f1e",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"#c8a84b",fontFamily:"Georgia,serif",gap:16}},
    React.createElement('div',{style:{fontSize:32}},"⛳"),
    React.createElement('div',{style:{fontSize:18}},"Cargando...")
  );

  if (error) return React.createElement('div', {style:{minHeight:"100vh",background:"#0a0f1e",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"#e87f7f",fontFamily:"Georgia,serif",gap:16,padding:20}},
    React.createElement('div',{style:{fontSize:32}},"⚠️"),
    React.createElement('div',{style:{fontSize:14,textAlign:"center"}},"Error: "+error)
  );

  const e = React.createElement;

    {key:"historial",label:"📅 Historial"},
    {key:"playoffs",label:"⚔ Playoffs"},
    {key:"final",label:"🏁 Final"},
    {key:"reglas",label:"📋 Reglas"},
  ];

  function RankingTab() {

      e('div',{style:{marginBottom:12,fontSize:11,color:"#667",letterSpacing:1}},"Top 8 puntajes · Playoffs ×2 · Mín. 6 fechas para clasificar"),

          e('div',{style:{display:"flex",alignItems:"center",padding:"14px 16px",gap:"14px"}},
            e('div',{style:{width:"36px",textAlign:"center",fontSize:isTop3?"24px":"18px",fontWeight:"900",color:isTop3?trophyColors[player.pos-1]:"#667",flexShrink:0}}, isTop3?trophyEmoji[player.pos-1]:`#${player.pos}`),
            e('div',{style:{flex:1}},
              e('div',{style:{fontWeight:"700",fontSize:"16px",color:isTop3?trophyColors[player.pos-1]:"#e8dcc8"}},player.name),

        "+ Agregar Fecha Playoff"

  function FinalTab() {
    return e('div', null,
      e('div',{style:{marginBottom:16,padding:"14px 16px",borderRadius:10,background:"rgba(200,75,75,0.08)",border:"1px solid rgba(200,75,75,0.25)"}},
        e('div',{style:{fontSize:13,color:"#e87f7f",letterSpacing:2,fontWeight:"bold",marginBottom:6}},"🏁 RONDA FINAL — STROKE PLAY"),
        e('div',{style:{fontSize:12,color:"#778",lineHeight:1.8}},"Score bruto − handicap = score neto. Menor score neto gana. Reparto: 1° 60% · 2° 30% · 3° 10%")
      ),
      e('div',{style:{fontSize:11,color:"#c8a84b",letterSpacing:2,textTransform:"uppercase",marginBottom:8}},"Handicaps"),
      e('div',{style:{marginBottom:16,borderRadius:10,border:"1px solid rgba(255,255,255,0.07)",overflow:"hidden"}},
        qualified.length===0 ? e('div',{style:{padding:14,color:"#556",fontSize:13}},"No hay clasificados aún.") : null,
        ...qualified.map((p,i) =>
          e('div',{key:p.name,style:{display:"flex",alignItems:"center",padding:"10px 16px",borderBottom:"1px solid rgba(255,255,255,0.05)",background:"rgba(255,255,255,0.03)"}},

      e('div',{style:{fontSize:11,color:"#c8a84b",letterSpacing:2,textTransform:"uppercase",marginBottom:8}},"Scores brutos"),

            e('span',{style:{width:28,color:"#667",fontSize:12}},`${i+1}°`),
            e('span',{style:{flex:1,fontSize:13}},p.name),
            e('input',{type:"number",min:"50",max:"130",placeholder:"score",value:finalScores[p.name]??"",onChange:ev=>setFinalScores(prev=>({...prev,[p.name]:ev.target.value})),style:{width:72,padding:"7px 8px",borderRadius:8,background:"rgba(0,0,0,0.5)",border:"1px solid rgba(200,168,75,0.3)",color:"#c8a84b",fontSize:16,textAlign:"center",fontFamily:"inherit"}})
          )
        )
      ),
      finalResults.length>0 ? e('div',null,
        e('div',{style:{fontSize:11,color:"#c8a84b",letterSpacing:2,textTransform:"uppercase",marginBottom:8}},"Resultados netos"),
        e('div',{style:{borderRadius:10,border:"1px solid rgba(255,255,255,0.07)",overflow:"hidden",marginBottom:16}},
          ...finalResults.map((p,i) =>
            e('div',{key:p.name,style:{display:"flex",alignItems:"center",padding:"12px 16px",borderBottom:"1px solid rgba(255,255,255,0.05)",background:i===0?"rgba(255,215,0,0.06)":i===1?"rgba(192,192,192,0.04)":i===2?"rgba(205,127,50,0.04)":"rgba(255,255,255,0.02)"}},
              e('span',{style:{width:32,fontSize:i<3?20:14,color:i<3?trophyColors[i]:"#667"}},i<3?trophyEmoji[i]:`${i+1}.`),
              e('div',{style:{flex:1}},
                e('div',{style:{fontSize:14,color:i<3?trophyColors[i]:"#e8dcc8"}},p.name),
                e('div',{style:{fontSize:11,color:"#667"}},`${p.gross} − ${p.hcp} = ${p.net}`)

        !finalClosed ? e('button',{onClick:()=>setFinalClosed(true),style:{width:"100%",padding:"16px",background:"linear-gradient(135deg,#c84b4b,#8b2020)",border:"none",borderRadius:12,color:"#fff",fontSize:15,fontWeight:"bold",letterSpacing:2,cursor:"pointer",fontFamily:"inherit"}},

          ...prizes.map((p,i) =>

    e('div',{style:{padding:"16px",maxWidth:"700px",margin:"0 auto"}},
      activeTab==="ranking"   ? e(RankingTab,null)  : null,
      activeTab==="historial" ? e(HistorialTab,null) : null,
      activeTab==="playoffs"  ? e(PlayoffsTab,null)  : null,
      activeTab==="final"     ? e(FinalTab,null)     : null,
      activeTab==="reglas"    ? e(ReglasTab,null)    : null
    ),
    showAddDate ? e('div',{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:100}},
      e('div',{style:{background:"#0d2137",border:"1px solid rgba(200,168,75,0.3)",borderRadius:"20px 20px 0 0",width:"100%",maxWidth:"700px",maxHeight:"90vh",overflowY:"auto",padding:"24px"}},
        e('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}},
          e('h2',{style:{margin:0,color:newIsPlayoff?"#a87fe8":"#c8a84b",fontSize:"18px"}},`${newIsPlayoff?"⚔️":"📅"} Fecha ${fechas.length+1}${newIsPlayoff?" — PLAYOFF":""}`),
          e('button',{onClick:()=>{setShowAddDate(false);setNewIsPlayoff(false);},style:{background:"none",border:"none",color:"#888",fontSize:"24px",cursor:"pointer"}},"✕")
        ),
        e('label',{style:{display:"flex",alignItems:"center",gap:10,marginBottom:16,padding:"10px 14px",borderRadius:8,background:"rgba(168,127,232,0.08)",border:"1px solid rgba(168,127,232,0.2)",cursor:"pointer"}},
          e('input',{type:"checkbox",checked:newIsPlayoff,onChange:ev=>setNewIsPlayoff(ev.target.checked),style:{width:16,height:16}}),
          e('span',{style:{fontSize:13,color:"#a87fe8"}},"⚔️ Fecha de Playoff (×2)")
        ),
        ...ALL_PLAYERS.map(p =>
          e('div',{key:p,style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"10px",padding:"10px 12px",background:"rgba(255,255,255,0.04)",borderRadius:"8px"}},
            e('span',{style:{flex:1,fontSize:"14px"}},p),
            e('label',{style:{display:"flex",alignItems:"center",gap:"4px",fontSize:"12px",color:"#888"}},
              e('input',{type:"checkbox",checked:!!newPaid[p],onChange:ev=>setNewPaid(prev=>({...prev,[p]:ev.target.checked}))}), " Pagó"
            ),
            e('label',{style:{display:"flex",alignItems:"center",gap:"4px",fontSize:"12px",color:"#4bc87a"}},
              e('input',{type:"radio",name:"winner",checked:newWinner===p,onChange:()=>setNewWinner(p)}), " 🏆"
            ),
            e('input',{type:"number",min:"0",value:newResults[p]??"",onChange:ev=>setNewResults(prev=>({...prev,[p]:ev.target.value})),placeholder:"pts",style:{width:"64px",padding:"6px 8px",borderRadius:"6px",background:"rgba(0,0,0,0.4)",border:`1px solid ${newIsPlayoff?"rgba(168,127,232,0.4)":"rgba(200,168,75,0.3)"}`,color:newIsPlayoff?"#a87fe8":"#c8a84b",fontSize:"16px",textAlign:"center"}})
          )
        ),
        e('button',{onClick:handleAddDate,style:{width:"100%",marginTop:"16px",padding:"16px",background:newIsPlayoff?"linear-gradient(135deg,#7b4fa8,#5a2d8a)":"linear-gradient(135deg,#c8a84b,#a8882b)",border:"none",borderRadius:"10px",color:"#fff",fontSize:"16px",fontWeight:"bold",cursor:"pointer",fontFamily:"inherit",letterSpacing:"2px"}},
          "GUARDAR FECHA"
        )
      )
    ) : null,
    e('div',{style:{textAlign:"center",padding:"20px",color:"#444",fontSize:"11px",letterSpacing:"1px"}},"ACARREOS HOLI CUP © 2026")
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
