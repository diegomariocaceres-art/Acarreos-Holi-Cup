<script>
const { useState, useEffect } = React;
const SUPABASE_URL = "https://xxbrrtxuqrbypaqioqfq.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4YnJydHh1cXJieXBhcWlvcWZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2OTY1MzMsImV4cCI6MjA5NTI3MjUzM30.dfVWR8PW52_CyqJUd1bnZCoWhefZNgSOlWo5783akHE";
const VIEW_ONLY = new URLSearchParams(location.search).get("viewer")==="1";
const headers = {
"apikey": SUPABASE_KEY,
"Authorization": "Bearer " + SUPABASE_KEY,
"Content-Type": "application/json",
"Prefer": "return=representation"
};
async function dbSelect() {
const res = await fetch(`${SUPABASE_URL}/rest/v1/fechas?select=*&order=id`, { headers });
if (!res.ok) throw new Error(await res.text());
return res.json();
}
async function dbInsert(row) {
if(VIEW_ONLY)throw new Error("Modo consulta");
const res = await fetch(`${SUPABASE_URL}/rest/v1/fechas`, {
method: "POST", headers,
body: JSON.stringify(row)
});
if (!res.ok) throw new Error(await res.text());
return res.json();
}
async function dbUpdate(id, row) {
if(VIEW_ONLY)throw new Error("Modo consulta");
const res = await fetch(`${SUPABASE_URL}/rest/v1/fechas?id=eq.${id}`, {
method: "PATCH", headers,
body: JSON.stringify(row)
});
if (!res.ok) throw new Error(await res.text());
return res.json();
}
async function dbDelete(id) {
if(VIEW_ONLY)throw new Error("Modo consulta");
const res = await fetch(`${SUPABASE_URL}/rest/v1/fechas?id=eq.${id}`, {
method: "DELETE", headers
});
if (!res.ok) throw new Error(await res.text());
}
const POINTS_TABLE = {1:100,2:75,3:60,4:50,5:40,6:30,7:20,8:10,9:1,10:1,11:1,12:1,13:1,14:1,15:1,16:1,17:1,18:1};
const FINAL_HANDICAP = {1:5,2:3,3:2,4:1};
const FINAL_HANDICAP_2026 = {1:6,2:5,3:4,4:3,5:2,6:1};
const PRIZE_SPLIT = {1:0.60,2:0.30,3:0.10};
const DEFAULT_PLAYERS = ["El Doctor","Felipao","Gio","Diegolfa","Felipe R","Ñaño","Daniel B","Garbimba Asesina","Pistolas","Juanca","Paisa","Nayibe","Fercho","El Nene","Metralla","Juan Rory","Chapo","Michael M","Peluza"];
const trophyColors = ["#FFD700","#C0C0C0","#CD7F32"];
const trophyEmoji = ["🥇","🥈","🥉"];
function calcTotalPoints(scores) {
return [...scores].sort((a,b)=>b-a).slice(0,8).reduce((a,b)=>a+b,0);
}
function buildPlayers(fechas, roster, season) {
return roster.map(name => {
const scores = fechas.map(f => {
const pts = f.resultados[name] ?? 0;
return f.es_playoff ? pts * (season >= 2027 ? 1.5 : 2) : pts;
});
const paid = fechas.map(f => f.pagos[name] ?? 0);
const wins = fechas.map(f => f.daily_wins[name] ?? 0);
const datesPlayed = fechas.filter(f => (f.resultados[name] ?? 0) > 0).length;
const total = calcTotalPoints(scores);
return { name, scores, paid, wins, datesPlayed, total };
});
}
function rankingToResultados(rankingOrder) {
const resultados = {};
const pagos = {};
const byPos = {};
rankingOrder.forEach(({name, pos}) => {
if (!byPos[pos]) byPos[pos] = [];
byPos[pos].push(name);
});
Object.entries(byPos).forEach(([pos, names]) => {
const p = parseInt(pos);
let totalPts = 0;
for (let i = 0; i < names.length; i++) {
totalPts += (POINTS_TABLE[p + i] || 1);
}
const pts = Math.round(totalPts / names.length);
names.forEach(name => {
resultados[name] = pts;
pagos[name] = 10;
});
});
