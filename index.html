function calcTotalPoints(scores) {
return [...scores].sort((a,b)=>b-a).slice(0,8).reduce((a,b)=>a+b,0);
}
function buildPlayers(fechas, roster, season) {
return roster.map(name => {
const scores = fechas.map(f => {
const pts = f.resultados[name] ?? 0;
return f.es_playoff ? pts * (season >= 2027 ? 1.5 : 2) : pts;
});
const paid = fechas.map(f => f.pagos[name] ?? 0);
const wins = fechas.map(f => f.daily_wins[name] ?? 0);
const datesPlayed = fechas.filter(f => (f.resultados[name] ?? 0) > 0).length;
const total = calcTotalPoints(scores);
return { name, scores, paid, wins, datesPlayed, total };
});
}
function rankingToResultados(rankingOrder) {
const resultados = {};
const pagos = {};
const byPos = {};
rankingOrder.forEach(({name, pos}) => {
if (!byPos[pos]) byPos[pos] = [];
byPos[pos].push(name);
});
Object.entries(byPos).forEach(([pos, names]) => {
const p = parseInt(pos);
let totalPts = 0;
for (let i = 0; i < names.length; i++) {
totalPts += (POINTS_TABLE[p + i] || 1);
}
const pts = Math.round(totalPts / names.length);
names.forEach(name => {
resultados[name] = pts;
pagos[name] = 10;
});
});
return { resultados, pagos };
}
