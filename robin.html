function calcCourseHcp(index,slope,rating,par){
 return Math.round(index*(slope/113)+(rating-par));
}
function strokesOnHole(courseHcp,holeHcpIndex){
 if(courseHcp<=0) return 0;
 const full=Math.floor(courseHcp/18);
 const rem=courseHcp%18;
 return full+(holeHcpIndex<=rem?1:0);
}
function netOnHole(gross,courseHcp,holeHcpIndex){
 return gross-strokesOnHole(courseHcp,holeHcpIndex);
}
function allCombos(){
 return[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
}
function sameCombo(a,b){
 var sa=[a[0].slice().sort((x,y)=>x-y),a[1].slice().sort((x,y)=>x-y)].sort((x,y)=>x[0]-y[0]);
 var sb=[b[0].slice().sort((x,y)=>x-y),b[1].slice().sort((x,y)=>x-y)].sort((x,y)=>x[0]-y[0]);
 return sa[0][0]===sb[0][0]&&sa[0][1]===sb[0][1]&&sa[1][0]===sb[1][0]&&sa[1][1]===sb[1][1];
}
function computeT2(t1,t3){
 var combos=allCombos();
 var rem=combos.filter(function(c){return !sameCombo(c,t1)&&!sameCombo(c,t3);});
 if(rem.length>0) return rem[0];
 return combos.find(function(c){return !sameCombo(c,t1);});
}

function emptyHoyo(){

}

 var t1Combo=[[greenOrder[0],greenOrder[2]],[greenOrder[1],greenOrder[3]]];

 function calcRaw(h,hi){
   var tercio=Math.floor(hi/6);
   var pairs=getPairs(tercio);
   var holeHcpIdx=cd.hcp[hi];
   var holePar=(HOLE_PARS[course]||[])[hi]||4;
   var nets=h.scores.map(function(s,i){return s!==null?netOnHole(s,courseHcps[i],holeHcpIdx):null;});
   if(nets.some(function(n){return n===null;})) return null;
   var allPutts=h.putts.every(function(p){return p!==null;});
   var p1=pairs[0]; var p2=pairs[1];
   var p1nets=p1.map(function(i){return nets[i];}); var p2nets=p2.map(function(i){return nets[i];});
   var p1low=Math.min.apply(null,p1nets); var p2low=Math.min.apply(null,p2nets);
   var p1high=Math.max.apply(null,p1nets); var p2high=Math.max.apply(null,p2nets);
   var p1sum=p1nets.reduce(function(a,b){return a+b;},0); var p2sum=p2nets.reduce(function(a,b){return a+b;},0);
   var pts1=0;
   if(p1low<p2low) pts1+=1; else if(p2low<p1low) pts1-=1;
   if(p1high<p2high) pts1+=1; else if(p2high<p1high) pts1-=1;
   if(p1sum<p2sum) pts1+=1; else if(p2sum<p1sum) pts1-=1;
   if(allPutts){
     var p1p=p1.map(function(i){return h.putts[i];}).reduce(function(a,b){return a+b;},0);
     var p2p=p2.map(function(i){return h.putts[i];}).reduce(function(a,b){return a+b;},0);
     if(p1p<p2p) pts1+=1; else if(p2p<p1p) pts1-=1;
   }
   if(h.gordita!==null){
     var gross=h.scores[h.gordita];
     var isGord=gross!==null&&gross<=holePar;
     var bonus=isGord?1:-1;
     if(p1.indexOf(h.gordita)!==-1) pts1+=bonus; else pts1-=bonus;
   }
   h.sandy.forEach(function(sv,i){if(sv){if(p1.indexOf(i)!==-1) pts1+=1; else pts1-=1;}});
   h.porfuerazo.forEach(function(pf,i){if(pf){if(p1.indexOf(i)!==-1) pts1+=1; else pts1-=1;}});
   return {pts1:pts1,pts2:-pts1,pair1:p1,pair2:p2,nets:nets};
 }

 function calcEffective(h,hi){
   var raw=calcRaw(h,hi);
   if(!raw) return null;
   var isLast=(hi+1)%6===0;
   var mult=isLast?(h.multiplier||1):1;
   return {pts1:raw.pts1*mult,pts2:raw.pts2*mult,pair1:raw.pair1,pair2:raw.pair2,nets:raw.nets,multiplier:mult,rawPts1:raw.pts1};
 }

 function calcTercio(t){
   var start=t*6;
   var pairs=getPairs(t);
   var total=0;
   for(var i=start;i<start+6;i++){var r=calcEffective(hoyos[i],i);if(r) total+=r.pts1;}
   var lastRaw=calcRaw(hoyos[start+5],start+5);
   var lastPts=lastRaw?lastRaw.pts1:0;
   var mult=hoyos[start+5].multiplier||1;
   var dolares=Math.abs(total)*pointValue+baseValue;
   return {pair1:pairs[0],pair2:pairs[1],total:total,lastPts:lastPts,multiplier:mult,dolares:dolares,winner:total>0?pairs[0]:total<0?pairs[1]:null};
 }

 function calcBalance(){
   var bal=[0,0,0,0];
   for(var t=0;t<3;t++){
     var r=calcTercio(t);
     if(r.winner){
       var loser=r.winner===r.pair1?r.pair2:r.pair1;
       r.winner.forEach(function(i){bal[i]+=r.dolares/2;});
       loser.forEach(function(i){bal[i]-=r.dolares/2;});
     }
   }
   return bal;
 }

 function runningScore(t,upTo){
   var total=0;
   for(var i=t*6;i<=upTo;i++){var r=calcEffective(hoyos[i],i);if(r) total+=r.pts1;}
   return total;
