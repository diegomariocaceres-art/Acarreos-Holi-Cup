<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Holi Robin</title>
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body style="margin:0;background:#0a0a0a">
<div id="root"></div>
<script>
const { useState } = React;
const e = React.createElement;

// ── COURSE DATA ──────────────────────────────────────────────────────────────
const COURSES = {
  "Miami Beach": {
    par: 72,
    hcp: [3,15,11,1,9,17,13,5,7,6,2,10,4,16,14,12,18,8],
    tees: {
      "Black":      { rating:74.2, slope:138 },
      "Blue":       { rating:72.0, slope:134 },
      "Blue/White": { rating:70.7, slope:130 },
      "White":      { rating:69.4, slope:126 },
    }
  },
  "Normandy Shores": {
    par: 71,
    hcp: [9,5,11,1,15,13,3,17,7,6,2,14,10,18,12,4,16,8],
    tees: {
      "Blue":       { rating:73.6, slope:140 },
      "Blue/White": { rating:72.9, slope:136 },
      "White":      { rating:72.3, slope:131 },
      "Gold":       { rating:69.4, slope:124 },
    }
  },
  "Miami Shores": {
    par: 71,
    hcp: [5,15,11,9,3,7,1,13,17,18,16,14,12,6,2,4,10,8],
    tees: {
      "Blue":       { rating:71.5, slope:124 },
      "Blue/White": { rating:70.5, slope:122 },
      "White":      { rating:69.5, slope:121 },
      "Gold":       { rating:67.3, slope:119 },
    }
  },
  "Miami Lakes": {
    par: 72,
    hcp: [3,13,15,1,7,9,17,11,5,12,4,8,16,2,14,10,18,6],
    tees: {
      "Black":      { rating:72.5, slope:128 },
      "Black/White":{ rating:71.4, slope:127 },
      "White":      { rating:70.3, slope:121 },
      "Green":      { rating:66.2, slope:113 },
    }
  },
  "Turnberry Soffer": {
    par: 70,
    hcp: [11,9,15,7,1,5,3,17,13,12,10,14,8,4,16,2,18,6],
    tees: {
      "Black":      { rating:72.2, slope:138 },
      "Blue":       { rating:70.3, slope:131 },
      "Blue/White": { rating:69.6, slope:129 },
      "White":      { rating:68.1, slope:121 },
    }
  },
  "Biltmore": {
    par: 71,
    hcp: [16,12,10,18,4,6,2,8,14,5,7,11,3,17,9,13,1,15],
    tees: {
      "Black":      { rating:74.3, slope:132 },
      "Blue":       { rating:71.2, slope:126 },
      "Blue/White": { rating:70.2, slope:124 },
      "White":      { rating:69.2, slope:122 },
    }
  },
  "Crandon": {
    par: 72,
    hcp: [8,2,12,6,14,16,4,18,10,5,1,9,7,11,3,17,15,13],
    tees: {
      "Black":      { rating:75.1, slope:146 },
      "Blue":       { rating:73.7, slope:142 },
      "Blue/White": { rating:72.8, slope:139 },
      "White":      { rating:71.8, slope:135 },
      "Green":      { rating:69.0, slope:126 },
    }
  },
};

// ── COLORS ───────────────────────────────────────────────────────────────────
const GOLD   = "#c8a84b";
const GREEN  = "#4bc87a";
const RED    = "#e87f7f";
const PURPLE = "#a87fe8";
const BG     = "#0a0f1e";
const CARD   = "rgba(255,255,255,0.04)";
const BORDER = "rgba(200,168,75,0.2)";

// ── LOGO SVG (Holi International) ────────────────────────────────────────────
const HoliLogo = () => e('div', {style:{textAlign:"center",margin:"0 auto 8px"}},
  e('div', {style:{
    width:80, height:80, borderRadius:"50%",
    background:"radial-gradient(circle,#8b2020 0%,#5a0f0f 100%)",
    border:"3px solid "+GOLD,
    display:"flex", alignItems:"center", justifyContent:"center",
    margin:"0 auto", fontSize:32, boxShadow:"0 0 20px rgba(200,168,75,0.3)"
  }}, "🍷")
);

// ── HANDICAP CALC ─────────────────────────────────────────────────────────────
function calcCourseHcp(index, slope, rating, par) {
  return Math.round(index * (slope / 113) + (rating - par));
}

// Strokes player gets on a specific hole
function strokesOnHole(courseHcp, holeHcpIndex) {
  if (courseHcp <= 0) return 0;
  if (courseHcp >= 18) {
    return 1 + (holeHcpIndex <= (courseHcp - 18) ? 1 : 0);
  }
  return holeHcpIndex <= courseHcp ? 1 : 0;
}

// Get pairs for each tercio
function getPairs(tercio) {
  if (tercio === 0) return [[0,2],[1,3]]; // 1st&3rd into green vs 2nd&4th
  if (tercio === 1) return [[0,1],[2,3]]; // cart A vs cart B... wait, T2=defined by cart
  return [[0,1],[2,3]]; // T3 = cart vs cart
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen]             = useState("setup");
  const [course, setCourse]             = useState("Miami Beach");
  const [players, setPlayers]           = useState([
    {name:"Jugador 1", hcpIndex:12, tee:"Blue"},
    {name:"Jugador 2", hcpIndex:18, tee:"Blue"},
    {name:"Jugador 3", hcpIndex:8,  tee:"Blue"},
    {name:"Jugador 4", hcpIndex:22, tee:"White"},
  ]);
  // Cart assignments: cart[0]=[p0,p1], cart[1]=[p2,p3]
  const [carts, setCarts]               = useState([[0,1],[2,3]]);
  // Hole 1 green order: who entered 1st, 2nd, 3rd, 4th
  const [greenOrder, setGreenOrder]     = useState([0,1,2,3]);
  const [greenOrderSet, setGreenOrderSet] = useState(false);
  const [hoyos, setHoyos]               = useState(
    Array.from({length:18}, (_,i) => ({
      scores: [null,null,null,null],
      gordita: null,
      flaquita: false,
      sandy: [false,false,false,false],
      porfuerazo: [false,false,false,false],
      multiplier: 1,
    }))
  );
  const [currentHoyo, setCurrentHoyo]  = useState(0);
  const [showMultiplier, setShowMultiplier] = useState(false);

  const cd = COURSES[course];

  // Course handicaps per player
  const courseHcps = players.map(p => {
    const td = cd.tees[p.tee];
    return td ? calcCourseHcp(p.hcpIndex, td.slope, td.rating, cd.par) : p.hcpIndex;
  });

  // Pairs per tercio
  // T1: based on green order (1st&3rd vs 2nd&4th)
  // T2 & T3: based on carts
  function getPairsForTercio(t) {
    if (t === 0) {
      // greenOrder[0]&greenOrder[2] vs greenOrder[1]&greenOrder[3]
      return [[greenOrder[0], greenOrder[2]], [greenOrder[1], greenOrder[3]]];
    }
    return [carts[0], carts[1]];
  }

  // Points for a single hole
  function calcHoyoPoints(h, hi) {
    const tercio = Math.floor(hi / 6);
    const pairs  = getPairsForTercio(tercio);
    const nets   = h.scores.map((s,i) => s !== null ? s - courseHcps[i] : null);
    if (nets.some(x => x === null)) return null;

    const p1 = pairs[0], p2 = pairs[1];
    const p1nets = p1.map(i => nets[i]);
    const p2nets = p2.map(i => nets[i]);

    const p1low  = Math.min(...p1nets), p2low  = Math.min(...p2nets);
    const p1high = Math.max(...p1nets), p2high = Math.max(...p2nets);
    const p1sum  = p1nets.reduce((a,b)=>a+b,0);
    const p2sum  = p2nets.reduce((a,b)=>a+b,0);

    let pts1 = 0;
    // Baja
    if (p1low  < p2low)  pts1 += 1; else if (p2low  < p1low)  pts1 -= 1;
    // Alta
    if (p1high < p2high) pts1 += 1; else if (p2high < p1high) pts1 -= 1;
    // Suma
    if (p1sum  < p2sum)  pts1 += 1; else if (p2sum  < p1sum)  pts1 -= 1;

    // Gordita (+1 to that player's team, -1 if flaquita)
    if (h.gordita !== null) {
      const bonus = h.flaquita ? -1 : 1;
      if (p1.includes(h.gordita)) pts1 += bonus; else pts1 -= bonus;
    }

    // Sandy
    h.sandy.forEach((s,i) => {
      if (s) { if (p1.includes(i)) pts1 += 1; else pts1 -= 1; }
    });

    // Porfuerazo
    h.porfuerazo.forEach((pf,i) => {
      if (pf) { if (p1.includes(i)) pts1 += 1; else pts1 -= 1; }
    });

    return { pts1, pts2:-pts1, pair1:p1, pair2:p2 };
  }

  // Tercio result
  function calcTercio(t) {
    const start = t * 6;
    const pairs = getPairsForTercio(t);
    let raw = 0;
    for (let i = start; i < start+6; i++) {
      const r = calcHoyoPoints(hoyos[i], i);
      if (r) raw += r.pts1;
    }
    const mult    = hoyos[start+5].multiplier || 1;
    const final   = raw * mult;
    const dolares = Math.abs(final) + 5;
    return {
      pair1: pairs[0], pair2: pairs[1],
      raw, final, multiplier: mult, dolares,
      winner: final > 0 ? pairs[0] : final < 0 ? pairs[1] : null,
    };
  }

  function calcBalance() {
    const bal = [0,0,0,0];
    for (let t=0; t<3; t++) {
      const r = calcTercio(t);
      if (r.winner) {
        const loser = r.winner === r.pair1 ? r.pair2 : r.pair1;
        r.winner.forEach(i => bal[i] += r.dolares/2);
        loser.forEach(i    => bal[i] -= r.dolares/2);
      }
    }
    return bal;
  }

  function updateScore(pi, val) {
    setHoyos(prev => {
      const n = [...prev];
      const s = [...n[currentHoyo].scores];
      s[pi] = val === "" ? null : parseInt(val);
      n[currentHoyo] = {...n[currentHoyo], scores:s};
      return n;
    });
  }

  function updateHoyo(field, val) {
    setHoyos(prev => {
      const n = [...prev];
      n[currentHoyo] = {...n[currentHoyo], [field]:val};
      return n;
    });
  }

  function toggleArr(field, pi) {
    setHoyos(prev => {
      const n = [...prev];
      const a = [...n[currentHoyo][field]];
      a[pi] = !a[pi];
      n[currentHoyo] = {...n[currentHoyo], [field]:a};
      return n;
    });
  }

  const isLastOfTercio = (currentHoyo + 1) % 6 === 0;
  const tercio         = Math.floor(currentHoyo / 6);
  const pairsNow       = getPairsForTercio(tercio);
  const holeHcp        = cd.hcp[currentHoyo];
  const currentH       = hoyos[currentHoyo];

  // Running score for current tercio
  const tercioStart = tercio * 6;
  let running1 = 0;
  for (let i = tercioStart; i <= currentHoyo; i++) {
    const r = calcHoyoPoints(hoyos[i], i);
    if (r) running1 += r.pts1;
  }

  function nextHoyo() {
    if (isLastOfTercio && !showMultiplier) { setShowMultiplier(true); return; }
    setShowMultiplier(false);
    if (currentHoyo < 17) setCurrentHoyo(h => h+1);
    else setScreen("summary");
  }

  // ── SETUP SCREEN ─────────────────────────────────────────────────────────
  if (screen === "setup") {
    return e('div',{style:{minHeight:"100vh",background:`linear-gradient(160deg,${BG} 0%,#0d2137 60%,#1a0a0a 100%)`,fontFamily:"Georgia,serif",color:"#e8dcc8",padding:20}},

      e('div',{style:{textAlign:"center",paddingTop:32,paddingBottom:20}},
        e(HoliLogo),
        e('div',{style:{fontSize:11,letterSpacing:5,color:GOLD,marginBottom:4}},"HOLI INTERNATIONAL"),
        e('h1',{style:{margin:"4px 0 2px",fontSize:38,fontWeight:900,color:"#fff",letterSpacing:2}},"ROBIN"),
        e('div',{style:{fontSize:12,color:"#667",letterSpacing:3}},"4SOMES · STROKE NETO")
      ),

      // Course
      e('div',{style:{marginBottom:16}},
        e('div',{style:{fontSize:11,color:GOLD,letterSpacing:2,marginBottom:8}},"CAMPO"),
        e('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
          ...Object.keys(COURSES).map(c =>
            e('button',{key:c, onClick:()=>setCourse(c),
              style:{padding:"10px 6px",borderRadius:10,
              background:course===c?"rgba(200,168,75,0.2)":CARD,
              border:`1px solid ${course===c?GOLD:BORDER}`,
              color:course===c?GOLD:"#aaa",fontSize:12,cursor:"pointer",fontFamily:"inherit",
              fontWeight:course===c?"bold":"normal"}}, c)
          )
        )
      ),

      // Players
      e('div',{style:{marginBottom:16}},
        e('div',{style:{fontSize:11,color:GOLD,letterSpacing:2,marginBottom:8}},"JUGADORES · MARCA · HCP"),
        ...players.map((p,i) => {
          const td = cd.tees[p.tee];
          const ch = td ? calcCourseHcp(p.hcpIndex, td.slope, td.rating, cd.par) : p.hcpIndex;
          return e('div',{key:i,style:{marginBottom:10,padding:"12px",background:CARD,borderRadius:10,border:`1px solid ${BORDER}`}},
            e('div',{style:{display:"flex",alignItems:"center",gap:8,marginBottom:8}},
              e('div',{style:{width:26,height:26,borderRadius:"50%",background:"rgba(200,168,75,0.2)",
                display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:GOLD,flexShrink:0}}, i+1),
              e('input',{value:p.name,
                onChange:ev=>setPlayers(prev=>{const n=[...prev];n[i]={...n[i],name:ev.target.value};return n;}),
                style:{flex:1,background:"transparent",border:"none",borderBottom:`1px solid ${BORDER}`,
                color:"#e8dcc8",fontSize:14,padding:"2px 0",fontFamily:"inherit",outline:"none"}}),
              e('div',{style:{display:"flex",alignItems:"center",gap:4,flexShrink:0}},
                e('span',{style:{fontSize:10,color:"#667"}},"HCP"),
                e('input',{type:"number",min:"0",max:"54",step:"0.1",value:p.hcpIndex,
                  onChange:ev=>setPlayers(prev=>{const n=[...prev];n[i]={...n[i],hcpIndex:parseFloat(ev.target.value)||0};return n;}),
                  style:{width:46,background:"rgba(0,0,0,0.4)",border:`1px solid ${BORDER}`,borderRadius:6,
                  color:GOLD,fontSize:13,padding:"3px 4px",textAlign:"center",fontFamily:"inherit"}})
              )
            ),
            // Tee selector per player
            e('div',{style:{display:"flex",gap:6,flexWrap:"wrap"}},
              ...Object.keys(cd.tees).map(t =>
                e('button',{key:t, onClick:()=>setPlayers(prev=>{const n=[...prev];n[i]={...n[i],tee:t};return n;}),
                  style:{padding:"4px 10px",borderRadius:6,fontSize:11,cursor:"pointer",fontFamily:"inherit",
                  background:p.tee===t?"rgba(200,168,75,0.2)":CARD,
                  border:`1px solid ${p.tee===t?GOLD:BORDER}`,
                  color:p.tee===t?GOLD:"#888"}}, t)
              )
            ),
            e('div',{style:{fontSize:10,color:"#667",marginTop:4}},
              td ? `Rating ${td.rating} · Slope ${td.slope} → ${ch} golpes en campo` : ""
            )
          );
        })
      ),

      // Cart assignments
      e('div',{style:{marginBottom:16,padding:"14px",background:CARD,borderRadius:12,border:`1px solid ${BORDER}`}},
        e('div',{style:{fontSize:11,color:GOLD,letterSpacing:2,marginBottom:10}},"🚗 CARRITOS (Tercio 2 y 3)"),
        e('div',{style:{fontSize:12,color:"#778",marginBottom:12}},"Arrastra o asigna quién va en cada carrito. El Tercio 3 es carrito vs carrito."),
        e('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
          ...[0,1].map(c =>
            e('div',{key:c,style:{padding:"10px",borderRadius:10,background:"rgba(200,168,75,0.06)",border:`1px solid ${BORDER}`}},
              e('div',{style:{fontSize:11,color:GOLD,marginBottom:8,textAlign:"center"}},`Carrito ${c+1}`),
              ...carts[c].map((pi,ci) =>
                e('div',{key:ci,style:{display:"flex",alignItems:"center",gap:6,marginBottom:6}},
                  e('div',{style:{width:20,height:20,borderRadius:"50%",background:"rgba(200,168,75,0.15)",
                    display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:GOLD}}, pi+1),
                  e('select',{value:pi,
                    onChange:ev=>{
                      const newPi = parseInt(ev.target.value);
                      setCarts(prev => {
                        const n = [[...prev[0]],[...prev[1]]];
                        // swap if needed
                        const otherCart = c === 0 ? 1 : 0;
                        const otherIdx  = n[otherCart].indexOf(newPi);
                        if (otherIdx !== -1) n[otherCart][otherIdx] = n[c][ci];
                        const sameIdx = n[c].indexOf(newPi);
                        if (sameIdx !== -1 && sameIdx !== ci) n[c][sameIdx] = n[c][ci];
                        n[c][ci] = newPi;
                        return n;
                      });
                    },
                    style:{flex:1,background:"rgba(0,0,0,0.4)",border:`1px solid ${BORDER}`,borderRadius:6,
                    color:"#e8dcc8",fontSize:12,padding:"4px",fontFamily:"inherit"}},
                    ...players.map((_,idx)=>e('option',{key:idx,value:idx},players[idx].name))
                  )
                )
              )
            )
          )
        )
      ),

      // Tercio preview
      e('div',{style:{marginBottom:24,padding:"12px 14px",background:"rgba(200,168,75,0.06)",border:`1px solid ${BORDER}`,borderRadius:12}},
        e('div',{style:{fontSize:11,color:GOLD,letterSpacing:2,marginBottom:8}},"PAREJAS POR TERCIO"),
        e('div',{style:{fontSize:12,color:"#aaa",marginBottom:6}},
          `T1 (H1-6): Se define en el Hoyo 1 — 1°&3° en entrar al green vs 2°&4°`),
        e('div',{style:{fontSize:12,color:"#aaa",marginBottom:4}},
          `T2 (H7-12): ${players[carts[0][0]].name} & ${players[carts[0][1]].name} vs ${players[carts[1][0]].name} & ${players[carts[1][1]].name}`),
        e('div',{style:{fontSize:12,color:"#aaa"}},
          `T3 (H13-18): ${players[carts[0][0]].name} & ${players[carts[0][1]].name} vs ${players[carts[1][0]].name} & ${players[carts[1][1]].name}`)
      ),

      e('button',{onClick:()=>{setScreen(greenOrderSet?"game":"greenorder");},
        style:{width:"100%",padding:16,background:"linear-gradient(135deg,#1a5c1a,#0d3a20)",
        border:`2px solid ${GOLD}`,borderRadius:12,color:GOLD,fontSize:16,fontWeight:"bold",
        letterSpacing:2,cursor:"pointer",fontFamily:"inherit"}},
        "⛳ EMPEZAR RONDA")
    );
  }

  // ── GREEN ORDER SCREEN (Hole 1) ───────────────────────────────────────────
  if (screen === "greenorder") {
    return e('div',{style:{minHeight:"100vh",background:`linear-gradient(160deg,${BG},#0d2137)`,fontFamily:"Georgia,serif",color:"#e8dcc8",padding:20}},
      e('div',{style:{textAlign:"center",paddingTop:40,paddingBottom:24}},
        e(HoliLogo),
        e('div',{style:{fontSize:18,fontWeight:"bold",color:GOLD,marginBottom:8}},"HOYO 1 — GREEN ORDER"),
        e('div',{style:{fontSize:13,color:"#778",lineHeight:1.8}},"¿En qué orden entraron al green?\n1° y 3° serán pareja en el Tercio 1.")
      ),
      e('div',{style:{marginBottom:24}},
        ...[0,1,2,3].map(pos =>
          e('div',{key:pos,style:{marginBottom:12}},
            e('div',{style:{fontSize:11,color:GOLD,letterSpacing:2,marginBottom:6}},
              `${pos+1}° EN ENTRAR`),
            e('div',{style:{display:"flex",gap:8}},
              ...players.map((_,pi) => {
                const used = greenOrder.slice(0,pos).includes(pi);
                const sel  = greenOrder[pos] === pi;
                return e('button',{key:pi, onClick:()=>{
                    if (used) return;
                    setGreenOrder(prev => {
                      const n = [...prev];
                      const oldPos = n.indexOf(pi);
                      if (oldPos !== -1 && oldPos !== pos) n[oldPos] = n[pos];
                      n[pos] = pi;
                      return n;
                    });
                  },
                  style:{flex:1,padding:"10px 4px",borderRadius:10,cursor:used?"not-allowed":"pointer",
                  background:sel?"rgba(200,168,75,0.25)":used?"rgba(255,255,255,0.02)":CARD,
                  border:`1px solid ${sel?GOLD:used?"rgba(255,255,255,0.05)":BORDER}`,
                  color:sel?GOLD:used?"#444":"#aaa",fontSize:12,fontFamily:"inherit"}},
                  players[pi].name.split(" ")[0])
              })
            )
          )
        )
      ),
      e('div',{style:{marginBottom:20,padding:"12px 14px",background:"rgba(200,168,75,0.06)",border:`1px solid ${BORDER}`,borderRadius:12}},
        e('div',{style:{fontSize:11,color:GOLD,letterSpacing:2,marginBottom:6}},"PAREJAS T1"),
        e('div',{style:{fontSize:13,color:"#e8dcc8"}},
          `${players[greenOrder[0]].name} & ${players[greenOrder[2]].name}`),
        e('div',{style:{fontSize:12,color:"#667",margin:"2px 0"}},"vs"),
        e('div',{style:{fontSize:13,color:"#e8dcc8"}},
          `${players[greenOrder[1]].name} & ${players[greenOrder[3]].name}`)
      ),
      e('button',{onClick:()=>{setGreenOrderSet(true);setScreen("game");},
        style:{width:"100%",padding:16,background:"linear-gradient(135deg,#c8a84b,#a8882b)",
        border:"none",borderRadius:12,color:"#000",fontSize:16,fontWeight:"bold",
        letterSpacing:2,cursor:"pointer",fontFamily:"inherit"}},
        "CONFIRMAR Y JUGAR ⛳")
    );
  }

  // ── GAME SCREEN ───────────────────────────────────────────────────────────
  if (screen === "game") {
    const hoyoNum   = currentHoyo + 1;
    const result    = calcHoyoPoints(currentH, currentHoyo);
    const teeColors = {Black:"#555",Blue:"#4a8fd4",White:"#e8dcc8","Blue/White":"#7ab8e8","Blue/Black":"#6a9fd4","Gold":"#c8a84b","Green":"#4bc87a","Black/White":"#888"};

    return e('div',{style:{minHeight:"100vh",background:`linear-gradient(160deg,${BG},#0d2137)`,fontFamily:"Georgia,serif",color:"#e8dcc8"}},

      // Header
      e('div',{style:{background:"rgba(0,0,0,0.5)",borderBottom:`1px solid ${BORDER}`,padding:"14px 16px"}},
        e('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},
          e('div',null,
            e('div',{style:{fontSize:10,color:"#667",letterSpacing:2}},"HOYO"),
            e('div',{style:{fontSize:34,fontWeight:900,color:GOLD,lineHeight:1}},hoyoNum),
            e('div',{style:{fontSize:10,color:"#667"}},"HCP "+holeHcp)
          ),
          e('div',{style:{textAlign:"center"}},
            e(HoliLogo),
            e('div',{style:{fontSize:10,color:"#667",letterSpacing:2}},`TERCIO ${tercio+1}`)
          ),
          e('div',{style:{textAlign:"right"}},
            e('div',{style:{fontSize:10,color:"#667",letterSpacing:2}},"PARCIAL"),
            e('div',{style:{fontSize:26,fontWeight:900,color:running1>0?GREEN:running1<0?RED:"#667"}},
              `${running1>0?"+":""}${running1}`),
            e('div',{style:{fontSize:9,color:"#667"}},
              `${players[pairsNow[0][0]].name.split(" ")[0]}&${players[pairsNow[0][1]].name.split(" ")[0]}`)
          )
        ),
        e('div',{style:{fontSize:11,color:"#aaa",textAlign:"center",padding:"4px 8px",
          background:"rgba(200,168,75,0.06)",borderRadius:6}},
          `${players[pairsNow[0][0]].name} & ${players[pairsNow[0][1]].name} `,
          e('span',{style:{color:"#555"}},"vs"),
          ` ${players[pairsNow[1][0]].name} & ${players[pairsNow[1][1]].name}`
        )
      ),

      e('div',{style:{padding:"14px 16px"}},

        // Multiplier modal
        showMultiplier && e('div',{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",
          display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}},
          e('div',{style:{background:"#0d2137",border:`2px solid ${GOLD}`,borderRadius:20,
            padding:24,width:"100%",maxWidth:340,textAlign:"center"}},
            e('div',{style:{fontSize:28,marginBottom:8}},"⚡"),
            e('div',{style:{fontSize:16,color:GOLD,fontWeight:"bold",marginBottom:4}},`Hoyo ${hoyoNum} — Fin Tercio ${tercio+1}`),
            e('div',{style:{fontSize:13,color:"#aaa",marginBottom:16}},"¿Cuánto se multiplica?"),
            e('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}},
              ...[1,2,3,4,5,6].map(m =>
                e('button',{key:m, onClick:()=>updateHoyo("multiplier",m),
                  style:{padding:"14px 0",borderRadius:10,
                  background:currentH.multiplier===m?"rgba(200,168,75,0.3)":CARD,
                  border:`1px solid ${currentH.multiplier===m?GOLD:BORDER}`,
                  color:currentH.multiplier===m?GOLD:"#aaa",
                  fontSize:20,fontWeight:"bold",cursor:"pointer",fontFamily:"inherit"}}, `${m}x`)
              )
            ),
            e('button',{onClick:()=>{setShowMultiplier(false);if(currentHoyo<17)setCurrentHoyo(h=>h+1);else setScreen("summary");},
              style:{width:"100%",padding:14,background:`linear-gradient(135deg,#c8a84b,#a8882b)`,
              border:"none",borderRadius:10,color:"#000",fontSize:15,fontWeight:"bold",
              cursor:"pointer",fontFamily:"inherit"}},
              `Confirmar ${currentH.multiplier}x y continuar ⛳`)
          )
        ),

        // Stroke advantage per hole
        e('div',{style:{marginBottom:12,padding:"10px 12px",background:"rgba(168,127,232,0.06)",
          border:`1px solid rgba(168,127,232,0.2)`,borderRadius:10}},
          e('div',{style:{fontSize:10,color:PURPLE,letterSpacing:2,marginBottom:6}},"GOLPE DE VENTAJA — HOYO "+hoyoNum+" (HCP "+holeHcp+")"),
          e('div',{style:{display:"flex",gap:8,flexWrap:"wrap"}},
            ...players.map((p,i) => {
              const strokes = strokesOnHole(courseHcps[i], holeHcp);
              return e('div',{key:i,style:{padding:"4px 10px",borderRadius:8,fontSize:11,
                background:strokes>0?"rgba(75,200,120,0.12)":"rgba(255,255,255,0.03)",
                border:`1px solid ${strokes>0?GREEN:BORDER}`,color:strokes>0?GREEN:"#667"}},
                `${p.name.split(" ")[0]}: `,
                e('strong',null, strokes>0?`-${strokes}`:"—"))
            })
          )
        ),

        // Scores
        e('div',{style:{marginBottom:12}},
          e('div',{style:{fontSize:11,color:GOLD,letterSpacing:2,marginBottom:8}},"SCORES BRUTOS"),
          ...players.map((p,i) => {
            const net = currentH.scores[i] !== null ? currentH.scores[i] - courseHcps[i] : null;
            const tc  = teeColors[p.tee] || GOLD;
            return e('div',{key:i,style:{display:"flex",alignItems:"center",gap:10,marginBottom:8,
              padding:"10px 12px",background:CARD,borderRadius:10,border:`1px solid ${BORDER}`}},
              e('div',{style:{flex:1}},
                e('div',{style:{display:"flex",alignItems:"center",gap:6}},
                  e('span',{style:{fontSize:13,fontWeight:"bold"}},p.name),
                  e('span',{style:{fontSize:10,color:tc,background:"rgba(0,0,0,0.3)",
                    padding:"1px 6px",borderRadius:4,border:`1px solid ${tc}`}},p.tee)
                ),
                e('div',{style:{fontSize:10,color:"#667"}},`Campo HCP: ${courseHcps[i]}`)
              ),
              e('input',{type:"number",min:"1",max:"15",value:currentH.scores[i]??"",
                onChange:ev=>updateScore(i,ev.target.value), placeholder:"bruto",
                style:{width:58,padding:"7px",borderRadius:8,background:"rgba(0,0,0,0.5)",
                border:`1px solid ${BORDER}`,color:GOLD,fontSize:20,textAlign:"center",fontFamily:"inherit"}}),
              net !== null && e('div',{style:{width:36,textAlign:"center",fontSize:18,fontWeight:"bold",
                color:net<0?GREEN:net>0?RED:"#aaa"}}, net)
            );
          })
        ),

        // Gordita + Flaquita
        e('div',{style:{marginBottom:10,padding:"10px 12px",background:CARD,borderRadius:10,border:`1px solid ${BORDER}`}},
          e('div',{style:{fontSize:11,color:GOLD,letterSpacing:2,marginBottom:8}},"🏌️ GORDITA · FLAQUITA"),
          e('div',{style:{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}},
            e('button',{onClick:()=>updateHoyo("gordita",null),
              style:{padding:"5px 10px",borderRadius:8,fontSize:11,cursor:"pointer",fontFamily:"inherit",
              background:currentH.gordita===null?"rgba(200,168,75,0.2)":CARD,
              border:`1px solid ${currentH.gordita===null?GOLD:BORDER}`,
              color:currentH.gordita===null?GOLD:"#667"}},"Nadie"),
            ...players.map((p,i)=>
              e('button',{key:i, onClick:()=>updateHoyo("gordita",currentH.gordita===i?null:i),
                style:{padding:"5px 10px",borderRadius:8,fontSize:11,cursor:"pointer",fontFamily:"inherit",
                background:currentH.gordita===i?"rgba(200,168,75,0.2)":CARD,
                border:`1px solid ${currentH.gordita===i?GOLD:BORDER}`,
                color:currentH.gordita===i?GOLD:"#aaa"}},
                p.name.split(" ")[0])
            )
          ),
          currentH.gordita !== null && e('label',{style:{display:"flex",alignItems:"center",gap:8,
            padding:"6px 10px",borderRadius:8,background:"rgba(232,127,127,0.08)",
            border:`1px solid rgba(232,127,127,0.2)`,cursor:"pointer"}},
            e('input',{type:"checkbox",checked:currentH.flaquita,
              onChange:ev=>updateHoyo("flaquita",ev.target.checked),style:{width:14,height:14}}),
            e('span',{style:{fontSize:12,color:RED}},"🏴 Flaquita — hizo bogey o peor (resta punto)")
          )
        ),

        // Sandy & Porfuerazo
        e('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}},
          ...[
            {field:"sandy",     label:"🏖️ SANDY",       color:GREEN},
            {field:"porfuerazo",label:"💥 PORFUERAZO",  color:PURPLE},
          ].map(({field,label,color}) =>
            e('div',{key:field,style:{padding:"10px",background:CARD,borderRadius:10,border:`1px solid ${BORDER}`}},
              e('div',{style:{fontSize:10,color:GOLD,letterSpacing:1,marginBottom:6}},label),
              ...players.map((p,i)=>
                e('button',{key:i, onClick:()=>toggleArr(field,i),
                  style:{display:"block",width:"100%",marginBottom:4,padding:"5px 8px",borderRadius:6,
                  cursor:"pointer",fontFamily:"inherit",textAlign:"left",fontSize:11,
                  background:currentH[field][i]?`rgba(${color==="#4bc87a"?"75,200,120":"168,127,232"},0.15)`:CARD,
                  border:`1px solid ${currentH[field][i]?color:BORDER}`,
                  color:currentH[field][i]?color:"#aaa"}},
                  `${currentH[field][i]?"✓":"○"} ${p.name.split(" ")[0]}`)
              )
            )
          )
        ),

        // Hole result
        result && e('div',{style:{marginBottom:12,padding:"10px",background:"rgba(200,168,75,0.05)",
          border:`1px solid ${BORDER}`,borderRadius:10,textAlign:"center"}},
          e('div',{style:{fontSize:10,color:"#667",marginBottom:3}},"RESULTADO HOYO"),
          e('div',{style:{fontSize:14,fontWeight:"bold",
            color:result.pts1===0?"#667":result.pts1>0?GREEN:RED}},
            result.pts1===0 ? "Empate" :
            result.pts1>0 ?
              `+${result.pts1} → ${players[result.pair1[0]].name.split(" ")[0]} & ${players[result.pair1[1]].name.split(" ")[0]}` :
              `+${Math.abs(result.pts1)} → ${players[result.pair2[0]].name.split(" ")[0]} & ${players[result.pair2[1]].name.split(" ")[0]}`
          )
        ),

        // Navigation
        e('div',{style:{display:"flex",gap:10,marginBottom:14}},
          currentHoyo > 0 && e('button',{onClick:()=>{setShowMultiplier(false);setCurrentHoyo(h=>h-1);},
            style:{flex:1,padding:13,background:CARD,border:`1px solid ${BORDER}`,borderRadius:12,
            color:"#aaa",fontSize:13,cursor:"pointer",fontFamily:"inherit"}},"← Ant."),
          e('button',{onClick:nextHoyo,
            style:{flex:2,padding:13,background:"linear-gradient(135deg,#1a5c1a,#0d3a20)",
            border:`2px solid ${GOLD}`,borderRadius:12,color:GOLD,fontSize:13,fontWeight:"bold",
            letterSpacing:1,cursor:"pointer",fontFamily:"inherit"}},
            currentHoyo===17 ? "🏁 Resultados" :
            isLastOfTercio   ? "⚡ Press / Sig →" : "Siguiente →")
        ),

        // Dot navigation
        e('div',{style:{display:"flex",justifyContent:"center",gap:4,flexWrap:"wrap"}},
          ...hoyos.map((h,i)=>{
            const done    = h.scores.some(s=>s!==null);
            const isCur   = i===currentHoyo;
            const tercioI = Math.floor(i/6);
            const colors  = ["rgba(200,168,75","rgba(168,127,232","rgba(75,200,120"];
            const c       = colors[tercioI];
            return e('button',{key:i, onClick:()=>{setShowMultiplier(false);setCurrentHoyo(i);},
              style:{width:26,height:26,borderRadius:"50%",cursor:"pointer",fontFamily:"inherit",fontSize:9,
              background:isCur?`${c},0.4)`:done?`${c},0.15)`:CARD,
              border:`1px solid ${isCur?c.replace("rgba","").replace(",",")")+",1)":done?c+",0.4)":BORDER}`.replace("rgba(","").replace(",0.4)","").replace(",0.15)",""),
              color:isCur||done?GOLD:"#667"}}, i+1)
          })
        )
      )
    );
  }

  // ── SUMMARY SCREEN ────────────────────────────────────────────────────────
  if (screen === "summary") {
    const bal     = calcBalance();
    const tercios = [0,1,2].map(t=>calcTercio(t));

    return e('div',{style:{minHeight:"100vh",background:`linear-gradient(160deg,${BG},#0d2137)`,fontFamily:"Georgia,serif",color:"#e8dcc8",padding:20}},
      e('div',{style:{textAlign:"center",paddingTop:24,paddingBottom:16}},
        e(HoliLogo),
        e('div',{style:{fontSize:13,letterSpacing:4,color:GOLD}},"HOLI ROBIN"),
        e('h2',{style:{margin:"4px 0",color:"#fff",letterSpacing:2}},"RESULTADOS"),
        e('div',{style:{fontSize:11,color:"#667"}},`${course} · Par ${cd.par}`)
      ),

      // Balance
      e('div',{style:{marginBottom:20}},
        e('div',{style:{fontSize:11,color:GOLD,letterSpacing:2,marginBottom:10}},"BALANCE FINAL"),
        ...players.map((p,i)=>
          e('div',{key:i,style:{display:"flex",alignItems:"center",padding:"12px 14px",marginBottom:8,
            borderRadius:12,border:`1px solid ${bal[i]>0?GREEN:bal[i]<0?RED:BORDER}`,
            background:bal[i]>0?"rgba(75,200,120,0.06)":bal[i]<0?"rgba(232,127,127,0.06)":CARD}},
            e('div',{style:{flex:1}},
              e('div',{style:{fontSize:15,fontWeight:"bold"}},p.name),
              e('div',{style:{fontSize:10,color:"#667"}},`${p.tee} · HCP ${p.hcpIndex} → ${courseHcps[i]}`)
            ),
            e('div',{style:{fontSize:24,fontWeight:900,color:bal[i]>0?GREEN:bal[i]<0?RED:"#667"}},
              `${bal[i]>0?"+":""}$${bal[i]}`)
          )
        )
      ),

      // Tercio breakdown
      e('div',{style:{marginBottom:20}},
        e('div',{style:{fontSize:11,color:GOLD,letterSpacing:2,marginBottom:10}},"TERCIOS"),
        ...tercios.map((t,i)=>
          e('div',{key:i,style:{marginBottom:10,padding:"12px 14px",borderRadius:12,background:CARD,border:`1px solid ${BORDER}`}},
            e('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}},
              e('div',{style:{fontSize:13,color:GOLD,fontWeight:"bold"}},`Tercio ${i+1} · H${i*6+1}-${i*6+6}`),
              t.multiplier>1 && e('div',{style:{padding:"2px 8px",borderRadius:6,
                background:"rgba(168,127,232,0.2)",border:`1px solid ${PURPLE}`,color:PURPLE,fontSize:11}},
                `${t.multiplier}x`)
            ),
            e('div',{style:{fontSize:11,color:"#aaa",marginBottom:4}},
              `${players[t.pair1[0]].name} & ${players[t.pair1[1]].name} vs ${players[t.pair2[0]].name} & ${players[t.pair2[1]].name}`),
            e('div',{style:{display:"flex",justifyContent:"space-between",fontSize:12}},
              e('span',{style:{color:"#667"}},`Pts: ${t.raw>0?"+":""}${t.raw} × ${t.multiplier}`),
              e('span',{style:{color:GOLD,fontWeight:"bold"}},`$${t.dolares}`)
            ),
            t.winner && e('div',{style:{marginTop:6,padding:"5px 10px",borderRadius:8,
              background:"rgba(75,200,120,0.08)",border:`1px solid ${GREEN}`,fontSize:11,color:GREEN}},
              `🏆 ${players[t.winner[0]].name} & ${players[t.winner[1]].name} · +$${t.dolares/2} c/u`)
          )
        )
      ),

      // Hole log
      e('div',{style:{marginBottom:24}},
        e('div',{style:{fontSize:11,color:GOLD,letterSpacing:2,marginBottom:10}},"HOYOS"),
        ...hoyos.map((h,i)=>{
          const r  = calcHoyoPoints(h,i);
          const tp = getPairsForTercio(Math.floor(i/6));
          if (!r) return null;
          return e('div',{key:i,style:{display:"flex",alignItems:"center",gap:8,
            padding:"7px 10px",marginBottom:3,borderRadius:8,background:CARD,
            border:`1px solid ${BORDER}`,fontSize:11}},
            e('span',{style:{color:"#667",width:18}},`${i+1}`),
            e('span',{style:{flex:1,color:r.pts1===0?"#667":r.pts1>0?GREEN:RED}},
              r.pts1===0?"Empate":
              r.pts1>0?`+${r.pts1} ${players[tp[0][0]].name.split(" ")[0]}&${players[tp[0][1]].name.split(" ")[0]}`:
              `+${Math.abs(r.pts1)} ${players[tp[1][0]].name.split(" ")[0]}&${players[tp[1][1]].name.split(" ")[0]}`
            ),
            h.gordita!==null&&e('span',{style:{color:GOLD}},"🏌️"),
            h.sandy.some(Boolean)&&e('span',{style:{color:GREEN}},"🏖️"),
            h.porfuerazo.some(Boolean)&&e('span',{style:{color:PURPLE}},"💥"),
            h.multiplier>1&&e('span',{style:{color:PURPLE}},`${h.multiplier}x`)
          );
        })
      ),

      e('button',{onClick:()=>{
          setScreen("setup");setCurrentHoyo(0);setShowMultiplier(false);setGreenOrderSet(false);
          setHoyos(Array.from({length:18},()=>({scores:[null,null,null,null],gordita:null,flaquita:false,sandy:[false,false,false,false],porfuerazo:[false,false,false,false],multiplier:1})));
        },
        style:{width:"100%",padding:16,background:CARD,border:`2px dashed ${GOLD}`,borderRadius:12,
        color:GOLD,fontSize:14,letterSpacing:2,cursor:"pointer",fontFamily:"inherit"}},
        "🔄 Nueva Ronda")
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
